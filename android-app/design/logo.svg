<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    几何制图法 · 原声吉他 Logo
    ═══════════════════════════════════════════
    φ (黄金比) = 1.6180339887

    【琴身】两个外切圆构成的 8 字形，这正是原声吉他的经典轮廓
      下圆 R   = 108, 圆心 C1 = (256, 352)
      上圆 r   = R/φ = 66.75 ≈ 67, 圆心 C2 = (256, 177)
      圆心距   = |352-177| = 175 ≈ R + r = 175  → 两圆精确外切
      切点 T   = (256, 244)  ← 即琴身"腰线"转折点，由相切关系唯一确定

    【音孔】上圆内同心圆
      音孔半径 = r/2 = 33.5 ≈ 34
      装饰环   = r×0.68 ≈ 46

    【琴颈】半宽 = r/φ ≈ 41，取 39；琴枕到切点，与琴身肩部相切
    【琴弦】6 弦等距，间距 = 2×39/5 = 15.6，由琴枕 x 线性收敛到琴桥 x
    ───────────────────────────────────────────
    所有曲线弧度与转折点均由 圆相切 / 同心 / 黄金分割 关系确定。
  -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- ===== 琴身：两大一小外切圆构成的 8 字轮廓 ===== -->
  <path d="M 256,460
           A 108,108 0 1 1 256,244
           A 67,67 0 1 1 256,110
           A 67,67 0 0 1 256,244
           A 108,108 0 1 1 256,460 Z"
        fill="none" stroke="#1c1c1c" stroke-width="13" stroke-linejoin="round"/>

  <!-- ===== 琴颈与琴枕：半宽 39 (=r/φ≈41 取整) ===== -->
  <path d="M 217,110 L 223,30 M 295,110 L 289,30"
        fill="none" stroke="#1c1c1c" stroke-width="13" stroke-linecap="round"/>
  <line x1="219" y1="30" x2="293" y2="30" stroke="#1c1c1c" stroke-width="13" stroke-linecap="round"/>

  <!-- ===== 音孔：同心圆 + 装饰环 ===== -->
  <circle cx="256" cy="177" r="34" fill="none" stroke="#1c1c1c" stroke-width="11"/>
  <circle cx="256" cy="177" r="46" fill="none" stroke="#1c1c1c" stroke-width="3.5" opacity="0.32"/>

  <!-- ===== 琴桥：下圆内黄金分割位 ===== -->
  <rect x="224" y="384" width="64" height="13" rx="6.5" fill="#1c1c1c"/>

  <!-- ===== 六根琴弦：等距，从琴枕收敛到琴桥 ===== -->
  <g stroke="#5cab2e" stroke-width="2.2" opacity="0.95">
    <line x1="224" y1="30" x2="232" y2="384"/>
    <line x1="238" y1="30" x2="244" y2="384"/>
    <line x1="252" y1="30" x2="252" y2="384"/>
    <line x1="266" y1="30" x2="260" y2="384"/>
    <line x1="280" y1="30" x2="272" y2="384"/>
    <line x1="292" y1="30" x2="284" y2="384"/>
  </g>
</svg>
